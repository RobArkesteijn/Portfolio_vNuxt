name: CI
on: [push]
jobs:
  lint:
    name: Lint project code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: install
        run: pnpm install
      - name: Build so required ./nuxt/tsconfig.json is created
        run: pnpm nuxi build
      - name: lint
        run: pnpm lint